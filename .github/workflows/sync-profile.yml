# Keep github.com/srmcguirt's profile README identical to profile/README.md here.
# Requires one repo secret: PROFILE_DEPLOY_KEY
#   (private half of a write-enabled deploy key registered on srmcguirt/srmcguirt)
name: Sync profile README

on:
  push:
    branches: [main]
    paths: [profile/README.md]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push README to srmcguirt/srmcguirt
        env:
          DEPLOY_KEY: ${{ secrets.PROFILE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/profile_sync
          chmod 600 ~/.ssh/profile_sync
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/profile_sync -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:srmcguirt/srmcguirt.git profile-repo
          cp profile/README.md profile-repo/README.md
          cd profile-repo
          if git diff --quiet; then echo "Profile README already up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync profile README from srmcguirt.github.io@${GITHUB_SHA::7}"
          git push
